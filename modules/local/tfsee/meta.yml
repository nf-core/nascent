name: "tfsee_analysis"
description: Comprehensive TFSee analysis for transcription factor-enhancer relationships from GRO-seq data
keywords:
  - transcription factors
  - enhancers
  - gro-seq
  - nascent transcription
  - motif analysis
  - clustering
  - machine learning
tools:
  - "tfsee":
      description: "TFSee: Transcription Factor-Enhancer Relationship Analysis"
      homepage: "https://github.com/nf-core/nascent"
      documentation: "https://github.com/nf-core/nascent"
      tool_dev_url: "https://github.com/nf-core/nascent"
      licence: "MIT"

input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - forward_bigwig:
      type: file
      description: BigWig file containing forward strand GRO-seq signal
      pattern: "*.{bw,bigwig}"
  - reverse_bigwig:
      type: file
      description: BigWig file containing reverse strand GRO-seq signal
      pattern: "*.{bw,bigwig}"
  - enhancer_regions:
      type: file
      description: BED file containing enhancer region coordinates
      pattern: "*.bed"
  - motif_database:
      type: file
      description: MEME format file containing transcription factor motifs
      pattern: "*.{meme,txt}"
  - expression_data:
      type: file
      description: Optional CSV file with gene expression data
      pattern: "*.csv"
  - tf_chip_peaks:
      type: file
      description: Optional pickle file with ChIP-seq peak data
      pattern: "*.pkl"
  - tfsee_config:
      type: file
      description: Optional JSON configuration file for TFSee parameters
      pattern: "*.json"

output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. [ id:'test', single_end:false ]
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
  - results:
      type: file
      description: Comprehensive TFSee analysis results summary
      pattern: "*_tfsee_results.csv"
  - motif_enrichment:
      type: file
      description: Motif enrichment analysis results
      pattern: "*_motif_enrichment.csv"
  - tf_enhancer_scores:
      type: file
      description: TF-enhancer association scores
      pattern: "*_tf_enhancer_scores.csv"
  - clustering_results:
      type: file
      description: Multi-view clustering results
      pattern: "*_clustering_results.csv"
  - features:
      type: file
      description: Comprehensive feature matrix
      pattern: "*_feature_matrix.csv"
  - statistics:
      type: file
      description: Statistical analysis results
      pattern: "*_statistics.csv"

authors:
  - "@your_github_username"
